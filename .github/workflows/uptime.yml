name: Uptime

on:
  # Gemessen 04.11.2026: GitHub startet einen '*/5'-Zeitplan real nur 3–5× am
  # Tag. Deshalb läuft der Wächter jetzt als Dauerlauf: ein Lauf prüft
  # 5 h 45 min lang alle 5 Minuten. Alle 3 Stunden wird ein neuer Lauf
  # angestoßen; über die concurrency-Gruppe wartet er, bis der laufende fertig
  # ist, und übernimmt dann nahtlos. Fällt ein Start aus, deckt der nächste
  # die Lücke. Öffentliches Repo → Actions-Minuten kostenlos, das Budget des
  # privaten Hauptrepos wird nicht angetastet.
  schedule:
    - cron: '7 */3 * * *'
  # Selbsttest und Nachprüfung von Hand.
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Selbsttest — zusätzliches, absichtlich fehlschlagendes Ziel prüfen (löst einen echten Alarm samt Mail aus)'
        type: boolean
        default: false

# Läufe dürfen sich nicht überholen; ein laufender Check wird NICHT abgebrochen,
# sonst verlieren wir womöglich genau den Lauf, der den Ausfall meldet.
concurrency:
  group: uptime
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  # Nur um bei einer Vorfall-Aenderung die Status-Seite sofort neu zu bauen.
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Dauerlauf 345 min + Puffer; GitHub-Grenze je Job: 360 min.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Von Hand (workflow_dispatch) genau eine Prüfung, geplant der Dauerlauf.
      # Jede Runde schreibt in eine eigene Ausgabedatei; meldet sie
      # „geaendert", wird die Status-Seite sofort neu gebaut. Ein interner
      # Fehler des Wächters bricht die Schleife nicht ab, macht den Lauf am
      # Ende aber rot (GitHub mailt dann von sich aus).
      - name: Ziele prüfen
        id: pruefen
        shell: bash
        run: |
          set -u
          ende=$(( $(date +%s) + ${DAUER_MINUTEN} * 60 ))
          fehler=0
          runde=0
          while :; do
            runde=$((runde + 1))
            aus=$(mktemp)
            echo "::group::Runde ${runde} ($(TZ=Europe/Berlin date '+%d.%m. %H:%M'))"
            GITHUB_OUTPUT="$aus" node monitor.mjs || fehler=1
            echo "::endgroup::"
            if grep -q '^geaendert=true' "$aus"; then
              echo "geaendert=true" >> "$GITHUB_OUTPUT"
              gh workflow run status.yml --repo "$GITHUB_REPOSITORY" --ref main || true
            fi
            rm -f "$aus"
            [ "$(date +%s)" -lt "$((ende - 300))" ] || break
            # bis zur nächsten vollen 5-Minuten-Marke schlafen
            sleep $(( 300 - $(date +%s) % 300 ))
          done
          echo "${runde} Runden geprüft."
          exit "$fehler"
        env:
          DAUER_MINUTEN: ${{ github.event_name == 'schedule' && '345' || '0' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          WEBHOOK_PROBE_URL: ${{ secrets.WEBHOOK_PROBE_URL }}
          # 🔴 Immospur laeuft unter einer NICHT BEWORBENEN Adresse mit
          # Zugangsabfrage. Dieses Repository ist oeffentlich — Adresse und
          # Zugangsdaten stehen deshalb ausschliesslich in Secrets und werden
          # in Issues und Mails ersetzt (`redact` in monitor.mjs).
          # Fehlen sie, werden die vier Immospur-Ziele uebersprungen — und das
          # steht dann SICHTBAR in der Lauf-Zusammenfassung.
          IMMOSPUR_URL: ${{ secrets.IMMOSPUR_URL }}
          IMMOSPUR_BENUTZER: ${{ secrets.IMMOSPUR_BENUTZER }}
          IMMOSPUR_PASSWORT: ${{ secrets.IMMOSPUR_PASSWORT }}
          FORCE_FAIL: ${{ inputs.force_fail && '1' || '' }}
