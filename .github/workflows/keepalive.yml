name: Keepalive

# GitHub schaltet geplante Workflows in Repos ohne Aktivität nach 60 Tagen
# automatisch AB (mit Vorwarn-Mail). Genau das wäre der stille Tod des
# Wächters — dieselbe Fehlerklasse, gegen die er gebaut wurde. Ein Commit
# pro Monat hält das Repo aktiv.
on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Lebenszeichen schreiben
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ  Wächter aktiv" >> LEBENSZEICHEN.txt
          tail -n 24 LEBENSZEICHEN.txt > LEBENSZEICHEN.tmp && mv LEBENSZEICHEN.tmp LEBENSZEICHEN.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LEBENSZEICHEN.txt
          git commit -m "chore: Lebenszeichen (haelt den geplanten Workflow aktiv)" || exit 0
          git push
